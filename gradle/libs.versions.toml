[versions]
mockito = "5.20.0"
spring-boot = "4.0.7"

[plugins]
lombok = { id = "io.freefair.lombok", version = "9.5.0" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-boot-aot = { id = "org.springframework.boot.aot", version.ref = "spring-boot" }
spring-dependencies = { id = "io.spring.dependency-management", version = "1.1.7" }
springdoc = { id = "org.springdoc.openapi-gradle-plugin", version = "1.9.0" }
openapi = { id = "org.openapi.generator", version = "7.23.0" }
loom = { id = "net.fabricmc.fabric-loom", version = "1.17-SNAPSHOT" }

[libraries]
springdoc = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "3.0.2" }
spring-boot-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
spring-boot-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test" }
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools" }
spring-boot-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-actuator-test = { group = "org.springframework.boot", name = "spring-boot-starter-actuator-test" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jackson-bom = { group = "com.fasterxml.jackson", name = "jackson-bom", version = "2.22.1" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind" }
jackson-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310" }
jakarta-annotations = { group = "jakarta.annotation", name = "jakarta.annotation-api", version = "2.1.1" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
devauth = { group = "me.djtheredstoner", name = "DevAuth-fabric", version = "1.2.1" }
minecraft = { group = "com.mojang", name = "minecraft", version = "26.1.2" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version = "0.19.3" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version = "0.154.2+26.1.2" }
httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version = "4.5.14" }
moulconfig = { group = "org.notenoughupdates.moulconfig", name = "modern-26.1", version = "4.7.2" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version = "1.13.12+kotlin.2.4.0" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version = "6.1.2" }