name: Setup Environment
description: Provisions Java 25 (Temurin) and Gradle with dependency caching.

inputs:
  cache-read-only:
    description: >
      Restrict the Gradle cache to read-only. Left unset, setup-gradle already
      writes only from the default branch, so this is an extra restriction.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Java 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '25'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}
