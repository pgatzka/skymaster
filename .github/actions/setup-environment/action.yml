name: Setup Environment
description: Provisions Java 25 (Temurin) and Gradle with dependency caching.

inputs:
  cache-read-only:
    description: >
      Restrict the Gradle cache to read-only. Left unset, setup-gradle already
      writes only from the default branch, so this is an extra restriction.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}
