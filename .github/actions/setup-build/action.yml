name: Setup Build
description: Provisions Java 25 (Temurin) and Gradle with dependency caching.

inputs:
  cache-read-only:
    description: >
      Restrict the Gradle cache to read-only. Left unset, setup-gradle already
      writes only from the default branch, so this is an extra restriction.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    # Supersedes setup-java's `cache: gradle` - do not enable both, they conflict.
    # Wrapper validation is performed automatically, so no separate
    # gradle/actions/wrapper-validation step is needed.
    # `basic` keeps caching on the MIT-licensed @actions/cache implementation
    # rather than the proprietary gradle-actions-caching component v6 defaults to.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}
