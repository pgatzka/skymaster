name: Claude Code Review
run-name: |
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Review
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1.0.195
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request. Work through the steps below in order.

            ## Step 1: Establish intent (do this first)

            Before reading the diff, find out what this PR is *supposed* to do.

            1. Read the PR itself:
               `gh pr view $PR_NUMBER --json title,body,author,baseRefName,headRefName,labels`
            2. Find linked issues, in this order of reliability:
               - `gh pr view $PR_NUMBER --json closingIssuesReferences` (authoritative — these are
                 issues GitHub will auto-close on merge)
               - Closing keywords in the PR body: `fixes #N`, `closes #N`, `resolves #N`
               - Bare `#N` references in the PR title or body
               - An issue number embedded in the branch name (e.g. `feat/1234-add-export`)
            3. For each issue found, read it in full including discussion:
               `gh issue view <N> --json number,title,body,labels,state,comments`
               Comments often contain scope changes, agreed trade-offs, and clarifications that
               contradict the original description. The most recent maintainer comment wins.

            If no issue can be found, say so explicitly in your top-level comment and review
            against the PR description instead. Do not invent requirements.

            ## Step 2: Requirements verification

            Break the issue down into discrete, checkable requirements (including acceptance
            criteria, reproduction steps that must now pass, and explicitly named edge cases).
            Then verify each one against the actual diff and surrounding code — not against the
            PR description, which may overstate what was done.

            Report this as a table in your top-level comment:

            | # | Requirement (from issue) | Status | Evidence / Gap |
            |---|--------------------------|--------|----------------|

            Use exactly one of these statuses per row:
            - **Implemented** — cite the file and function that satisfies it
            - **Partial** — works for the common path, but state precisely what is missing
            - **Missing** — no code in this PR addresses it
            - **Out of scope** — deliberately deferred; cite the comment or PR note saying so
            - **Cannot verify** — requires runtime/manual checks; state what a reviewer should do

            Also flag, as separate points:
            - **Scope creep**: changes in this PR that no requirement asked for. These aren't
              automatically bad, but they should be called out so a reviewer can decide whether
              they belong in a separate PR.
            - **Wrong-problem risk**: the code is correct but solves a different problem than the
              issue describes, or fixes a symptom rather than the root cause the issue identifies.
            - **Regression risk**: existing behavior the issue did not ask to change, but which
              this diff changes anyway.

            If a requirement is ambiguous, do not guess at a verdict — quote the ambiguous line
            from the issue and ask the author to confirm the intended interpretation.

            ## Step 3: Code review

            Independent of whether requirements are met, review the changes for:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios
               - Specifically: is there a test that would have failed before this change and
                 passes now? For a bug fix, is the issue's exact reproduction case covered?

            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            ## Output format

            - Use **inline comments** for specific, actionable issues anchored to a line, including
              places where the implementation diverges from the issue's requirements.
            - Use a **top-level comment** for: the requirements table from Step 2, a one-line
              verdict, general observations, and praise for things done well.
            - Open the top-level comment with the verdict on a single line:
              `**Issue #N: fully implemented | partially implemented | not implemented | no linked issue**`
            - Be specific and concrete. Prefer "this returns 500 instead of 404 when the record is
              missing, which contradicts acceptance criterion 3" over "error handling could be better".
            - Distinguish blocking problems from suggestions. Prefix optional feedback with `nit:`.
            - Do not pad the review. If the PR fully implements the issue cleanly, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
