name: Deploy

# Reusable rather than a composite action because it needs `environment:`, which
# is a job-level key. A calling job cannot set `environment:` itself - the only
# keys allowed there are name, uses, with, secrets, strategy, needs, if,
# concurrency and permissions - so the environment must live on the job below.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment. Must exist in repository settings.
        required: true
        type: string
      image-digest:
        description: >
          Immutable image digest (sha256:...) to deploy. Promoted unchanged from
          the build, so every environment runs the exact bytes that were verified.
        required: true
        type: string

permissions: { }

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    # Deployments must queue rather than cancel: cancelling a half-finished
    # rollout leaves the environment in an unknown state.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Report Target
        run: |
          echo "PLACEHOLDER - no deploy target is provisioned yet."
          echo "Environment: ${{ inputs.environment }}"
          echo "Image:       ghcr.io/${{ github.repository }}@${{ inputs.image-digest }}"
          echo
          echo "To make this real, replace this step with the deployment call."
          echo "Deploy by digest, never by tag - that is what makes ci and"
          echo "production provably the same artifact."
