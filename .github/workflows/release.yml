name: Release

run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Build
        uses: ./.github/actions/setup-build

      # The tag is the single source of truth for the released version. Nothing
      # is read from gradle.properties, so a release can never ship -SNAPSHOT.
      - name: Resolve Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Upload Server Jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: skymaster-server/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error

  publish-image:
    name: Publish Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Server Jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: skymaster-server/build/libs

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The org.opencontainers.image.source label emitted here is what links the
      # package to this repository, so it inherits the repo's public visibility.
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and Push Image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: skymaster-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Anchored to the digest, not a tag - tags move, digests do not.
      - name: Attest Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-mod:
    name: Publish Mod
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Build
        uses: ./.github/actions/setup-build

      - name: Publish Mod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :skymaster-mod:publishModPublicationToGitHubPackagesRepository
          -Pversion=${{ needs.build.outputs.version }}

  # Placeholder. Modrinth publishing needs a MODRINTH_TOKEN secret and a project
  # created on modrinth.com; neither exists yet.
  publish-modrinth:
    name: Publish to Modrinth
    needs: [ build, publish-mod ]
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Not Configured
        run: |
          echo "PLACEHOLDER - Modrinth publishing is not configured."
          echo "Needs: a Modrinth project, a MODRINTH_TOKEN secret, and removal of 'if: false'."
          exit 1

  # Placeholder. Promotes the exact digest built above through ci then production.
  # Enable by removing `if: false` once a deploy target exists.
  deploy-ci:
    name: Deploy to CI
    needs: publish-image
    if: false
    uses: deploy.yml
    with:
      environment: ci
      image-digest: ${{ needs.publish-image.outputs.digest }}

  deploy-production:
    name: Deploy to Production
    needs: [ publish-image, deploy-ci ]
    if: false
    uses: deploy.yml
    with:
      environment: production
      image-digest: ${{ needs.publish-image.outputs.digest }}
