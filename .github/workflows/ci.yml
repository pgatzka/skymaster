name: CI

run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Escalated per job. Any permission left undeclared is set to `none`.
permissions: { }

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
      - name: Verify Formatting
        run: ./gradlew spotlessCheck
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
      - name: Build
        run: ./gradlew build
      - name: Analyze Server
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :skymaster-server:sonar -Dsonar.qualitygate.wait=true
      - name: Analyze mod
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :skymaster-mod:sonar
      - name: Upload Server Jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: skymaster-server/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: skymaster-mod/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
  build-image:
    name: Build Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Server Jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: skymaster-server/build/libs
      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GHCR
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=snapshot
      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: skymaster-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  ci-gate:
    name: CI Gate
    needs: [ verify, build, build-image ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dependencies Succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
  deploy-ci:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    needs: [build-image]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: snapshot
      environment: ci
    secrets: inherit
