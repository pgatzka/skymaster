name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-formatting:
    name: Verify Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Verify Formatting
        run: ./gradlew spotlessCheck
  verify-compilation:
    name: Verify Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Verify Compilation
        run: ./gradlew compileJava
  run-server-tests:
    name: Run Server Tests
    runs-on: ubuntu-latest
    needs: verify-compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Run Server Tests
        run: ./gradlew :skymaster-server:test
  run-mod-tests:
    name: Run Server Tests
    runs-on: ubuntu-latest
    needs: verify-compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Run Server Tests
        run: ./gradlew :skymaster-mod:test
  scan-sonar:
    name: Scan Sonar
    runs-on: ubuntu-latest
    needs:
      - run-mod-tests
      - run-server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Scan Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - run-server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Build Server
        run: ./gradlew build
  build-mod:
    name: Build Mod
    runs-on: ubuntu-latest
    needs:
      - run-mod-tests
      - run-server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Build Mod
        run: ./gradlew :skymaster-mod:build