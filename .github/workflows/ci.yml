name: CI

run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-server-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  verify-server-formatting:
    runs-on: ubuntu-latest
    needs:
      - verify-server-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  generate-openapi-spec:
    runs-on: ubuntu-latest
    needs:
      - verify-server-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  generate-openapi-sources:
    runs-on: ubuntu-latest
    needs:
      - generate-openapi-spec
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  verify-api-compile:
    runs-on: ubuntu-latest
    needs:
      - generate-openapi-sources
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  verify-api-formatting:
    runs-on: ubuntu-latest
    needs:
      - verify-api-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  verify-mod-compile:
    runs-on: ubuntu-latest
    needs:
      - verify-api-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  verify-mod-formatting:
    runs-on: ubuntu-latest
    needs:
      - verify-mod-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  run-server-tests:
    runs-on: ubuntu-latest
    needs:
      - verify-server-formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  run-api-tests:
    runs-on: ubuntu-latest
    needs:
      - verify-api-formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  run-mod-tests:
    runs-on: ubuntu-latest
    needs:
      - verify-mod-formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  build-server:
    runs-on: ubuntu-latest
    needs:
      - run-server-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  build-api:
    runs-on: ubuntu-latest
    needs:
      - run-api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  build-mod:
    runs-on: ubuntu-latest
    needs:
      - run-mod-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  sonar-scan-server:
    runs-on: ubuntu-latest
    needs:
      - build-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  sonar-scan-api:
    runs-on: ubuntu-latest
    needs:
      - build-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  sonar-scan-mod:
    runs-on: ubuntu-latest
    needs:
      - build-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  package-server:
    runs-on: ubuntu-latest
    needs:
      - build-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  publish-server:
    runs-on: ubuntu-latest
    needs:
      - package-server
      - sonar-scan-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  publish-mod:
    runs-on: ubuntu-latest
    needs:
      - build-mod
      - sonar-scan-mod
      - sonar-scan-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  deploy-server:
    runs-on: ubuntu-latest
    needs:
      - publish-server
      - generate-openapi-spec
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
  