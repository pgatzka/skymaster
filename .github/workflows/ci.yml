name: CI

run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Escalated per job. Any permission left undeclared is set to `none`.
permissions: { }

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
      - name: Verify Formatting
        run: ./gradlew spotlessCheck
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
      - name: Build
        run: ./gradlew build
      - name: Analyze Server
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :skymaster-server:sonar -Dsonar.qualitygate.wait=true
      - name: Analyze mod
        # if: env.HAS_SONAR_TOKEN == 'true'
        # env:
        #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :skymaster-mod:sonar
      - name: Upload Server Jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: skymaster-server/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
      - name: Upload Mod Jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: |
            skymaster-mod/build/libs/*.jar
            skymaster-mod/build/libs/*-sources.jar
          retention-days: 7
          if-no-files-found: error
  build-image:
    name: Build Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Server Jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: skymaster-server/build/libs
      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GHCR
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=snapshot
      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: skymaster-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  ci-gate:
    name: CI Gate
    needs: [ verify, build, build-image, publish-mod ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      HAS_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL != '' }}
    steps:
      - name: Verify Dependencies Succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: Notify on failure
        if: failure() && env.HAS_WEBHOOK_URL == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
  deploy-ci:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    needs: [ build-image ]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: snapshot
      environment: ci
    secrets: inherit
  publish-mod:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    environment: modrinth
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
      - name: get unique snapshot version
        id: version
        run: |
          set -euo pipefail
          base_version=$(./gradlew -q printVersion | tail -n 1)
          printf 'version=%s-%s\n' "$base_version" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: download mod jar
        uses: actions/download-artifact@v8
        with:
          name: mod-jar
          path: skymaster-mod/build/libs
      - name: validate modrinth project
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: oxXL4meD
        run: |
          set -euo pipefail
          project_id=$(curl --fail --silent --show-error \
            -H "Authorization: $TOKEN" \
            -H "User-Agent: pgatzka/skymaster" \
            "https://api.modrinth.com/v2/project/$MODRINTH_ID" \
            | jq -r '.id // empty')
          test "$project_id" = "$MODRINTH_ID"
      - name: publish mod
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: oxXL4meD
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: skymaster-mod/build/libs/*.jar
          version-type: alpha
          github-token: ""
          modrinth-featured: false
          version: ${{ steps.version.outputs.version }}