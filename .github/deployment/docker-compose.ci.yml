name: ${COMPOSE_PROJECT_NAME}

services:
  application:
    image: ${APP_IMAGE}
    ports:
      - '${HOST_PORT}:8080'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s